<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="НейроХАБ">
  <defs>
    <linearGradient id="metal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#17222d"/>
      <stop offset="0.45" stop-color="#02070d"/>
      <stop offset="1" stop-color="#0c151e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.58" stop-color="#41dcff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#03111c"/>
      <stop offset="0.37" stop-color="#07131e"/>
      <stop offset="0.49" stop-color="#09d8ff"/>
      <stop offset="0.56" stop-color="#e7fbff"/>
      <stop offset="0.67" stop-color="#00a6e0"/>
      <stop offset="1" stop-color="#020811"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-30%" width="116%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00cfff" flood-opacity="0.12"/>
    </filter>
    <filter id="xGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#00d8ff" flood-opacity="0.72"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#00a9ff" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="transparent"/>

  <g filter="url(#shadow)" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900">
    <text x="42" y="178" font-size="142" fill="url(#metal)" stroke="#d7edf5" stroke-opacity="0.08" stroke-width="2" letter-spacing="-7">Нейро</text>
    <text x="742" y="178" font-size="142" fill="url(#metal)" stroke="#d7edf5" stroke-opacity="0.08" stroke-width="2" letter-spacing="-4">АБ</text>
    <text x="42" y="178" font-size="142" fill="url(#edge)" opacity="0.32" letter-spacing="-7">Нейро</text>
    <text x="742" y="178" font-size="142" fill="url(#edge)" opacity="0.28" letter-spacing="-4">АБ</text>
  </g>

  <g filter="url(#xGlow)">
    <text x="620" y="185" font-family="Arial Black, Impact, Arial, sans-serif" font-size="176" font-weight="900" fill="url(#cyan)" stroke="#d7faff" stroke-opacity="0.1" stroke-width="1" transform="skewX(-12)">Х</text>
    <path d="M620 205 L755 40" stroke="#0bdcff" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <path d="M638 183 L736 62" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <path d="M418 66 C450 78 473 78 506 66 L500 90 C472 102 448 102 424 90 Z" fill="url(#metal)" stroke="#d7edf5" stroke-opacity="0.1" stroke-width="1.5" filter="url(#shadow)"/>
</svg>
